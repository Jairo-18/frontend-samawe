@defer (on immediate) {
  @if (isStaffUser) {
    <!-- Sin `headerTitle` ni `contentInfo`: decían "Bienvenido a tu Sistema
         Contable y Administrativo · ¿Qué deseas hacer?", que habla del sistema
         y no de quien lo usa. El saludo por nombre y hora de `app-card-home`
         hace ese trabajo mejor y sin repetirlo. -->
    <app-base-page [showBorder]="false" [pxMobile]="false">
      <app-card-home></app-card-home>
    </app-base-page>
  } @else {
    <app-hero-section
      [org]="org"
      [isLoggedUser]="isLoggedUser"
    ></app-hero-section>
    <app-most-requested-section [org]="org"></app-most-requested-section>
    <app-experience-section [org]="org"></app-experience-section>
    <app-about-us-section [org]="org"></app-about-us-section>
    <app-reservation-section [org]="org"></app-reservation-section>
    <app-benefits-section
      [org]="org"
      [benefitSections]="benefitSections"
    ></app-benefits-section>
    <app-how-to-arrive-section [org]="org"></app-how-to-arrive-section>
  }
}
