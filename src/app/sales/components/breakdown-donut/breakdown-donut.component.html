<div
  class="donut-card p-6 md:p-8 rounded-2xl border border-[var(--primary-color)] shadow-md h-full"
>
  <span
    class="panel-heading block mb-4 text-xs md:text-lg font-semibold text-[var(--on-surface)]"
  >
    {{ titleKey | translate }}
  </span>
  @if (chartData) {
    <div class="flex flex-col sm:flex-row items-center gap-5">
      <div class="relative w-40 h-40 shrink-0">
        <canvas
          baseChart
          [data]="chartData"
          [options]="chartOptions"
          [type]="'doughnut'"
        ></canvas>
      </div>
      <ul class="flex flex-col gap-2 w-full min-w-0">
        @for (row of rows; track row.name) {
          <li class="flex items-center justify-between gap-2 text-xs md:text-sm">
            <span class="flex items-center gap-2 min-w-0">
              <span
                class="inline-block w-3 h-3 rounded-full shrink-0"
                [style.background-color]="row.color"
              ></span>
              <span class="truncate">{{ row.name }}</span>
            </span>
            <span class="shrink-0 text-right">
              <span class="font-semibold">{{ row.total | formatCop }}</span>
              <span class="text-[var(--on-surface-muted)]">
                · {{ row.percent.toFixed(0) }}%</span
              >
            </span>
          </li>
        }
      </ul>
    </div>
  } @else {
    <p class="text-[var(--on-surface-muted)]">{{ 'sales.no_sales_period' | translate }}</p>
  }
</div>
