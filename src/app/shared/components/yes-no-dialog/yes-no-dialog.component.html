<app-base-dialog
  [title]="data?.title || 'Confirmar'"
  [description]="
    parts ? '' : data?.message || '¿Estás seguro de realizar esta acción?'
  "
>
  <!-- Con `highlights`, el mensaje va en el espacio del formulario para poder
       resaltar fragmentos; sin ellos, se pinta como descripción de siempre. -->
  @if (parts) {
    <p form class="text-base leading-relaxed">
      @for (part of parts; track $index) {
        @if (part.cls) {
          <strong [class]="part.cls">{{ part.text }}</strong>
        } @else {
          {{ part.text }}
        }
      }
    </p>
  }
  <!-- Confirmar en VERDE (la acción) y Cancelar en ROJO (la salida), igual que
       en los diálogos de nota. Estaba al revés: el verde invita a pulsar y era
       el que cancelaba, en el diálogo que sale al BORRAR cosas.
       `mat-fab` sin color → verde de marca; `color="warn"` → rojo. -->
  <div actions>
    <section class="flex content-between gap-x-2">
      <button mat-fab extended="true" (click)="confirmAction()">
        Confirmar
      </button>
      <button mat-fab extended="true" color="warn" (click)="cancelAction()">
        Cancelar
      </button>
    </section>
  </div>
</app-base-dialog>
