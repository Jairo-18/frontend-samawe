<article class="brand-content-center">
  <article
    class="w-[95%] xl:w-[95%] lg:w-[90%] h-max md:h-full rounded-[4px] px-2 md:px-7 py-4 md:py-7 my-8 md:my-10 bg-[var(--bg-primary-color)]"
    [ngClass]="{
      'border border-[var(--brand)]': showBorder,
      'px-3 md:px-7': pxMobile
    }"
  >
    @if (showBackButton) {
      <div class="mb-4">
        <button
          mat-stroked-button
          [routerLink]="backButtonRoute"
          [matTooltip]="backButtonTooltip"
          color="primary"
          class="border-none"
        >
          <mat-icon class="flex justify-center items-center"
            >arrow_back</mat-icon
          >
          {{ backButtonText }}
        </button>
      </div>
    }
    @if (showHeader) {
      <section class="w-full flex">
        <span class="page-title text-xl md:text-3xl">{{ headerTitle }}</span>
      </section>
    }
    @if (showInfo && infoText) {
      <div class="mb-4">
        <!-- `text-black-50` y `fw-semibold` no son clases de Tailwind — no
             hacían nada, ni en claro ni en oscuro; el texto salía con el color
             heredado sin más. Se deja explícito con el token correcto. -->
        <span class="text-sm md:text-base text-[var(--on-surface-muted)] font-semibold">
          {{ infoText }}
        </span>
      </div>
    }
    @if (showActions) {
      <section
        class="w-full h-full items-end justify-end flex text-sm md:text-base"
      >
        <ng-content select="[slot=actions]"></ng-content>
      </section>
    }
    @if (showContentTitle) {
      <section
        class="w-full flex row pb-2 mb-3 md:mb-5 justify-content-between mx-0 mt-4"
        [ngClass]="{
          'border-b-[2px] border-b-[var(--brand)]': showContentBorder
        }"
      >
        <span class="page-title text-xl md:text-3xl">{{ contentTitle }}</span>
      </section>
    }
    @if (showContentInfo && contentInfo) {
      <div class="mb-4">
        <!-- Mismo caso que `infoText` arriba: `brand-text-body-m`,
             `text-black-50` y `fw-semibold` no existen como clases. -->
        <span
          class="text-sm md:text-base text-[var(--on-surface-muted)] font-semibold"
        >
          {{ contentInfo }}
        </span>
      </div>
    }
    <ng-content></ng-content>
  </article>
</article>
