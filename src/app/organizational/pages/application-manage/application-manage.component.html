<app-base-page
  [headerTitle]="'organizational.app_manage.title' | translate"
  [showContentTitle]="true"
  [contentInfo]="'organizational.app_manage.subtitle' | translate"
  [showContentInfo]="true"
>
  @if (!isLoading) {
    <!-- Va FUERA del grupo de pestañas a propósito: los cuatro primeros tabs
         comparten un único formulario, así que se pueden dejar cambios en
         "Apariencia" y acabar en otra pestaña. Aquí el aviso se ve siempre.
         (Legales, Multimedia y Google no pasan por este formulario: guardan
         cada acción al momento.) -->
    @if (dirtyTabKeys.length) {
      <div
        class="flex flex-wrap items-center gap-2 rounded-[4px] border border-[var(--warning-border)] bg-[var(--warning-bg)] px-4 py-2 mb-4 text-[var(--warning)]"
        role="status"
      >
        <mat-icon class="!text-[20px] !w-5 !h-5 shrink-0">info</mat-icon>
        <span class="text-sm">{{
          'organizational.app_manage.unsaved_changes' | translate
        }}</span>
        <!-- Los nombres de las pestañas con cambios: sin esto el aviso obliga a
             recorrerlas una por una buscando qué se tocó. -->
        @for (key of dirtyTabKeys; track key) {
          <span
            class="rounded-full border border-[var(--warning)] bg-[var(--warning-bg)] px-2 py-0.5 text-xs font-semibold text-[var(--warning)]"
            >{{ key | translate }}</span
          >
        }
      </div>
    }

    <mat-tab-group>
      <mat-tab label="{{ 'organizational.app_manage.tab_general' | translate }}">
        <ng-template matTabContent>
          <app-organizational-general-info
            [form]="form"
            [identificationTypes]="identificationTypes"
            [filteredPhoneCodes]="filteredPhoneCodes"
            [loadingPhoneCodes]="loadingPhoneCodes"
            [legalRepresentative]="organization?.legalRepresentative"
            (phoneCodeSelected)="onPhoneCodeSelected($event)"
            (save)="save()"
          ></app-organizational-general-info>
        </ng-template>
      </mat-tab>

      <mat-tab label="{{ 'organizational.app_manage.tab_appearance' | translate }}">
        <ng-template matTabContent>
          <app-organizational-appearance
            [form]="form"
            (save)="save()"
          ></app-organizational-appearance>
        </ng-template>
      </mat-tab>

      <mat-tab label="{{ 'organizational.app_manage.tab_home_content' | translate }}">
        <ng-template matTabContent>
          <app-organizational-home-content
            [form]="form"
            [benefitSections]="benefitSections"
            (save)="save()"
          ></app-organizational-home-content>
        </ng-template>
      </mat-tab>

      <mat-tab label="{{ 'organizational.app_manage.tab_web_content' | translate }}">
        <ng-template matTabContent>
          <app-organizational-web-content
            [form]="form"
            [corporateValues]="corporateValues"
            [corporateValueForm]="corporateValueForm"
            [editingValue]="editingValue"
            [corporateValueImageLoading]="corporateValueImageLoading"
            [benefitSections]="benefitSections"
            [benefitSectionForm]="benefitSectionForm"
            [editingSection]="editingSection"
            (save)="save()"
            (saveValue)="saveCorporateValue()"
            (deleteValue)="deleteCorporateValue($event)"
            (editValue)="startEditValue($event)"
            (cancelEdit)="cancelEditValue()"
            (uploadValueImage)="uploadCorporateValueImage($event)"
            (deleteValueImage)="deleteCorporateValueImage($event)"
            (saveSectionEvt)="saveBenefitSection()"
            (deleteSectionEvt)="deleteBenefitSection($event)"
            (editSectionEvt)="startEditSection($event)"
            (cancelSectionEditEvt)="cancelSectionEdit()"
            (addItemEvt)="addBenefitItem($event)"
            (updateItemEvt)="updateBenefitItem($event)"
            (deleteItemEvt)="deleteBenefitItem($event)"
          ></app-organizational-web-content>
        </ng-template>
      </mat-tab>

      <mat-tab label="{{ 'organizational.app_manage.tab_legal' | translate }}">
        <ng-template matTabContent>
          <app-organizational-legal
            [legalSections]="legalSections"
            (createSectionEvt)="createLegalSection($event)"
            (deleteSectionEvt)="deleteLegalSection($event)"
            (addItemEvt)="addLegalItem($event)"
            (updateItemEvt)="updateLegalItem($event)"
            (deleteItemEvt)="deleteLegalItem($event)"
            (addChildEvt)="addLegalChild($event)"
            (updateChildEvt)="updateLegalChild($event)"
            (deleteChildEvt)="deleteLegalChild($event)"
            (reorderItemsEvt)="reorderLegalItems($event)"
            (reorderChildrenEvt)="reorderLegalChildren($event)"
          ></app-organizational-legal>
        </ng-template>
      </mat-tab>

      <mat-tab label="{{ 'organizational.app_manage.tab_multimedia' | translate }}">
        <ng-template matTabContent>
          <app-organizational-multimedia
            [mediaMap]="mediaMap"
            [mediaTypes]="mediaTypes"
            [mediaLoading]="mediaLoading"
            [organizationalId]="organizationalId"
            (fileSelected)="onFileSelected($event.event, $event.code)"
            (deleteMedia)="deleteMedia($event)"
            (previewMedia)="previewMedia($event)"
          ></app-organizational-multimedia>
        </ng-template>
      </mat-tab>

      <mat-tab label="{{ 'organizational.app_manage.tab_google' | translate }}">
        <ng-template matTabContent>
          @if (organizationalId) {
            <app-organizational-google-business
              [organizationalId]="organizationalId"
              [successFromCallback]="googleBusinessSuccess"
            ></app-organizational-google-business>
          }
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  } @else {
    <app-loader></app-loader>
  }
</app-base-page>
