<nav
  aria-label="Navegación principal"
  class="fixed top-0 left-0 w-full z-[100] transition-all duration-300 ease-in-out py-2"
  [ngClass]="{
    'bg-white': !isScrolled || isPastHero || !isHomePage,
    'shadow-lg': isScrolled,
    'lg:bg-transparent lg:shadow-none lg:backdrop-blur-sm':
      isScrolled && !isPastHero && isHomePage
  }"
>
  <!--
    Hasta 2xl (<1536px) los 7 enlaces + logo + login + idioma no caben en una
    sola fila: necesitan ~1240px y se apelotonan en cualquier portátil. Con
    `flex-wrap` y el `w-full` de la sección de enlaces, estos bajan a una
    segunda fila y arriba quedan solo marca y acciones. Los `order-*` son los
    que mantienen el orden visual marca · enlaces · acciones en 2xl, donde
    vuelve a ser una sola fila.
    Si se cambia el punto de corte, hay que mover con él `--nav-bar-height`
    en `global.scss`, o la barra tapará el contenido.
  -->
  <article class="flex flex-wrap 2xl:flex-nowrap gap-y-1 px-6 items-center w-full">
    <!-- Branding -->
    <section
      class="order-1 flex flex-1 items-center gap-x-3 transition-colors duration-300"
    >
      <img
        routerLink="/"
        [src]="logoUrl"
        [alt]="organizationalName"
        class="h-14 w-14 2xl:h-[70px] 2xl:w-[70px] cursor-pointer transition-all duration-300"
      />
      <span
        class="hidden lg:block text-base 2xl:text-base 3xl:text-lg font-semibold transition-colors duration-300"
        [ngClass]="
          isScrolled && !isPastHero && isHomePage
            ? 'text-white'
            : 'text-gray-800'
        "
      >
        {{ organizationalName | capitalize }}
      </span>
    </section>

    <!-- Links de navegación -->
    <section
      class="order-3 2xl:order-2 hidden lg:flex w-full 2xl:w-auto flex-none items-center justify-center gap-x-1 lg:gap-x-2 2xl:gap-x-1 3xl:gap-x-4 transition-colors duration-300"
      [ngClass]="
        isScrolled && !isPastHero && isHomePage ? 'text-white' : 'text-gray-800'
      "
    >
      @for (item of navBarItems; track $index) {
        <a
          [routerLink]="item.route"
          routerLinkActive="!text-[var(--primary-color)]"
          [routerLinkActiveOptions]="item.exact ? exactOptionsStrict : exactOptions"
          class="cursor-pointer hover-underline-animation font-medium text-sm lg:text-base px-1 lg:px-1 3xl:px-2 py-1 transition-colors duration-200 whitespace-nowrap flex items-center gap-2"
        >
          <mat-icon class="scale-90" *ngIf="item.icon">{{
            item.icon
          }}</mat-icon>
          <span class="font-medium text-sm">{{ item.title }}</span>
        </a>
      }
    </section>

    <!-- Acciones: login / usuario + hamburguesa -->
    <section
      class="order-2 2xl:order-3 flex flex-1 items-center justify-end gap-x-4 2xl:gap-x-3"
    >
      <!-- Desktop: login o menú usuario -->
      <div class="hidden lg:flex">
        @if (isBrowser) {
          @if (!isLoggedUser) {
            @if (loginItem) {
              <app-button-landing
                [label]="loginItem.title ?? ''"
                [icon]="loginItem.icon ?? ''"
                variant="transparent"
                [routerLink]="loginItem.route"
              />
            }
          } @else {
            <app-button-landing
              [label]="userInfo?.firstName ?? ''"
              variant="transparent"
              [matMenuTriggerFor]="userMenu"
            >
              <!-- Sin avatar propio se usa la imagen genérica, no el icono -->
              <img
                slot="icon"
                [src]="userInfo?.avatarUrl || defaultAvatar"
                alt="avatar"
                class="w-7 h-7 min-w-7 shrink-0 rounded-full object-cover border border-[var(--primary-color)]"
              />
              <mat-icon
                slot="suffix"
                class="!text-[18px] !w-[18px] !h-[18px] !leading-[18px]"
              >
                keyboard_arrow_down
              </mat-icon>
            </app-button-landing>

            <mat-menu #userMenu="matMenu" xPosition="before">
              <ng-container *ngFor="let item of loggedMenuItems">
                <ng-container
                  *ngIf="
                    item.children && item.children.length > 0;
                    else regularItem
                  "
                >
                  <button mat-menu-item [matMenuTriggerFor]="subMenu">
                    <mat-icon class="text-[var(--primary-color)]">{{
                      item.icon
                    }}</mat-icon>
                    <span>{{ item.title ?? '' | translate }}</span>
                  </button>
                  <mat-menu #subMenu="matMenu">
                    <button
                      mat-menu-item
                      *ngFor="let child of item.children"
                      [routerLink]="child.route"
                    >
                      <mat-icon class="text-[var(--primary-color)]">{{
                        child.icon
                      }}</mat-icon>
                      <span>{{ child.title ?? '' | translate }}</span>
                    </button>
                  </mat-menu>
                </ng-container>
                <ng-template #regularItem>
                  <button mat-menu-item [routerLink]="item.route">
                    <mat-icon class="text-[var(--primary-color)]">{{
                      item.icon
                    }}</mat-icon>
                    <span>{{ item.title ?? '' | translate }}</span>
                  </button>
                </ng-template>
              </ng-container>
              <mat-divider />
              <button
                mat-menu-item
                (click)="logoutEvent.emit()"
                class="text-red-600"
              >
                <mat-icon class="text-red-600">logout</mat-icon>
                <span class="font-bold">{{ 'auth.logout' | translate }}</span>
              </button>
            </mat-menu>
          }
        }
      </div>

      <!-- Lang switcher -->
      <app-lang-switcher
        class="hidden lg:flex"
        [ngClass]="
          isScrolled && !isPastHero && isHomePage
            ? 'text-white'
            : 'text-gray-700'
        "
      />

      <!-- Mobile: hamburguesa -->
      <button
        class="flex lg:hidden p-1 transition-colors"
        [attr.aria-label]="'nav.open_menu' | translate"
        (click)="openMenu.emit()"
      >
        <mat-icon>menu</mat-icon>
      </button>
    </section>
  </article>
</nav>
