@if (showNotificationsIcon) {
  <div
    class="h-full w-full flex items-center"
    (click)="$event.stopPropagation()"
  >
    <button
      mat-icon-button
      (click)="toggleMenu($event)"
      class="!bg-[var(--surface-raised)] shadow border border-[var(--border-color)] relative"
      matBadge="{{ unreadNotifications }}"
      [matBadgeHidden]="unreadNotifications === 0"
      matBadgeColor="warn"
      matBadgePosition="above after"
    >
      <mat-icon class="text-[var(--brand)]"> notifications </mat-icon>
    </button>

    @if (isMenuOpen) {
      <article
        class="fixed top-[70px] right-2 md:right-6 z-[1050] bg-[var(--surface-sunken)]/95 backdrop-blur-sm rounded-lg shadow-2xl border-[0.5px] border-[var(--brand)] overflow-hidden"
        style="
          width: 900px;
          max-width: 95vw;
          max-height: 60vh;
          display: flex;
          flex-direction: column;
          z-index: 1000;
        "
        (click)="$event.stopPropagation()"
      >
        <div class="h-full w-full flex flex-col">
          <div
            class="w-full px-4 py-3 border-b border-[var(--brand)] font-bold flex flex-col gap-2 bg-[var(--surface-raised)]/60"
          >
            <div class="w-full flex flex-col">
              <span class="panel-heading text-lg md:text-xl text-[var(--on-surface)]">{{ 'notifications.title' | translate }}</span>
              @if (unreadNotifications > 0) {
                <span class="text-xs font-normal text-[var(--on-surface-muted)]">{{ unreadNotifications }} {{ 'notifications.unread' | translate }}</span>
              }
            </div>
            <div class="w-full flex gap-2">
              <button
                mat-stroked-button
                color="primary"
                class="!text-[10px] md:!text-[12px] !h-8 md:!h-10 !px-2 flex items-center gap-1 w-full"
                (click)="markAllRead()"
              >
                <mat-icon class="!text-sm !w-4 !h-4">done_all</mat-icon> {{ 'notifications.read_all' | translate }}
              </button>
              <button
                mat-stroked-button
                class="!text-[10px] md:!text-[12px] !h-8 md:!h-10 !px-2 flex items-center gap-1 !text-[var(--on-surface-muted)] w-full"
                (click)="markAllUnread()"
              >
                <mat-icon class="!text-sm !w-4 !h-4">mark_as_unread</mat-icon>
                {{ 'notifications.unread_all' | translate }}
              </button>
              <button
                mat-stroked-button
                color="warn"
                class="!text-[10px] md:!text-[12px] !h-8 md:!h-10 !px-2 flex items-center gap-1 w-full"
                (click)="deleteAll()"
              >
                <mat-icon class="!text-xs md:!text-base !w-4 md:!w-6 !h-4 md:!h-6">delete_sweep</mat-icon>
                {{ 'notifications.clear' | translate }}
              </button>
            </div>
          </div>

          <mat-tab-group>
            <mat-tab
              [label]="('notifications.kitchen' | translate) + ' ' + (tabStates['ENC'].pagination?.total || 0)"
            >
              <ng-template matTabContent>
                <app-notification-tab-content
                  *ngIf="tabStates['ENC']?.data"
                  [list]="tabStates['ENC'].data"
                  [stateCode]="'ENC'"
                  [loading]="tabStates['ENC'].loading"
                  (scrollContent)="onScroll($event.event, $event.stateCode)"
                  (itemClick)="goToOrder($event)"
                  (toggleRead)="toggleRead($event.event, $event.notif)"
                  (delete)="deleteNotification($event.event, $event.notif)"
                ></app-notification-tab-content>
              </ng-template>
            </mat-tab>
            <mat-tab
              [label]="('notifications.delivered' | translate) + ' ' + (tabStates['ENT'].pagination?.total || 0)"
            >
              <ng-template matTabContent>
                <app-notification-tab-content
                  *ngIf="tabStates['ENT']?.data"
                  [list]="tabStates['ENT'].data"
                  [stateCode]="'ENT'"
                  [loading]="tabStates['ENT'].loading"
                  (scrollContent)="onScroll($event.event, $event.stateCode)"
                  (itemClick)="goToOrder($event)"
                  (toggleRead)="toggleRead($event.event, $event.notif)"
                  (delete)="deleteNotification($event.event, $event.notif)"
                ></app-notification-tab-content>
              </ng-template>
            </mat-tab>
          </mat-tab-group>
        </div>
      </article>
    }
  </div>
}
